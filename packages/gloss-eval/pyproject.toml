[project]
name = "gloss-eval"
version = "0.1.0"
description = "M6: evaluation metrics and reports"
requires-python = ">=3.12"
dependencies = ["gloss-core"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_eval"]
