[project]
name = "gloss-parse"
version = "0.1.0"
description = "M2: layout-aware PDF parsing (VRDU) and LaTeX ground truth"
requires-python = ">=3.12"
dependencies = ["gloss-core"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_parse"]
