[project]
name = "gloss-core"
version = "0.1.0"
description = "Shared data models, settings, logging and DB access"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_core"]
