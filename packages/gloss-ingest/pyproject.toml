[project]
name = "gloss-ingest"
version = "0.1.0"
description = "M1: source adapters (arXiv, ACL Anthology, ...) and de-duplication"
requires-python = ">=3.12"
dependencies = ["gloss-core", "httpx>=0.27", "typer>=0.12"]

[project.scripts]
gloss-ingest = "gloss_ingest.cli:app"

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_ingest"]
