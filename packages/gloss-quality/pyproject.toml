[project]
name = "gloss-quality"
version = "0.1.0"
description = "M5: document classification and checklist completeness"
requires-python = ">=3.12"
dependencies = ["gloss-core", "pyyaml>=6.0"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_quality"]
