[project]
name = "gloss-retrieval"
version = "0.1.0"
description = "M3/M7: embeddings, vector store and RAG"
requires-python = ">=3.12"
dependencies = ["gloss-core"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_retrieval"]
