[project]
name = "gloss-entities"
version = "0.1.0"
description = "M4: named entity recognition and entity linking"
requires-python = ">=3.12"
dependencies = ["gloss-core"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_entities"]
