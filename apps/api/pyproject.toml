[project]
name = "gloss-api"
version = "0.1.0"
description = "FastAPI service exposing search, Q&A and entity endpoints"
requires-python = ">=3.12"
dependencies = ["gloss-core", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
gloss-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss_api"]
