[project]
name = "gloss"
version = "0.1.0"
description = "Gloss: entity-centric RAG and document intelligence for research papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gloss-core",
    "gloss-ingest",
    "gloss-parse",
    "gloss-chunk",
    "gloss-entities",
    "gloss-quality",
    "gloss-retrieval",
    "gloss-eval",
    "gloss-api",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
gloss-core = { workspace = true }
gloss-ingest = { workspace = true }
gloss-parse = { workspace = true }
gloss-chunk = { workspace = true }
gloss-entities = { workspace = true }
gloss-quality = { workspace = true }
gloss-retrieval = { workspace = true }
gloss-eval = { workspace = true }
gloss-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "poethepoet>=0.31",
    "types-PyYAML>=6.0",
    "httpx2",
]

# ---------- tooling ----------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "gloss_core", "gloss_ingest", "gloss_parse", "gloss_chunk",
    "gloss_entities", "gloss_quality", "gloss_retrieval", "gloss_eval", "gloss_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = [
    "packages/gloss-core/src", "packages/gloss-ingest/src", "packages/gloss-parse/src",
    "packages/gloss-chunk/src", "packages/gloss-entities/src", "packages/gloss-quality/src",
    "packages/gloss-retrieval/src", "packages/gloss-eval/src", "apps/api/src",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-q --import-mode=importlib"

# ---------- tasks (cross-platform: `uv run poe <task>`) ----------

[tool.poe.tasks]
fmt = "ruff format ."
lint = "ruff check ."
typecheck = "mypy packages/*/src apps/api/src"
test = "pytest"
check = ["lint", "typecheck", "test"]
db-up = "docker compose up -d postgres"
db-down = "docker compose down"
api = "uvicorn gloss_api.main:app --reload"
